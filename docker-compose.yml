services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: intelidoc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - intelidoc-net

  backend:
    build:
      context: ./intelidoc-backend
      dockerfile: Dockerfile
    container_name: intelidoc-backend
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      # host.docker.internal permite que el contenedor hable con tu Ollama local en Windows
      # - SPRING_AI_OLLAMA_BASE_URL=http://docker.internal
      - SPRING_AI_OLLAMA_BASE_URL=http://192.168.65.254:11434
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intelidoc-net

  frontend:
    build:
      context: ./intelidoc-frontend
      dockerfile: Dockerfile
    container_name: intelidoc-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - intelidoc-net

networks:
  intelidoc-net:
    driver: bridge
